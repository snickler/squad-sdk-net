name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, preview, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changesets:
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require changeset for SDK changes
        shell: pwsh
        run: |
          $baseSha = '${{ github.event.pull_request.base.sha }}'
          $headSha = '${{ github.event.pull_request.head.sha }}'
          $changedFiles = @(git diff --name-only "$baseSha...$headSha")
          # Only require changesets for C# source code changes, not for csproj-only changes
          # (e.g., Dependabot dependency updates). This keeps Dependabot PRs self-mergeable.
          $sdkChanges = @($changedFiles | Where-Object { $_ -like 'src/Squad.SDK.NET/**/*.cs' })

          if ($sdkChanges.Count -eq 0) {
              Write-Host 'No SDK source changes detected — changeset not required.'
              exit 0
          }

          $changesetFiles = @($changedFiles | Where-Object {
                  $_ -like '.changeset/*.md' -and $_ -ne '.changeset/README.md'
              })

          if ($changesetFiles.Count -eq 0) {
              throw 'Changes to src/Squad.SDK.NET require a .changeset entry.'
          }

          & ./scripts/Changesets.ps1 -Operation status

  build:
    needs: [changesets]
    if: always() && !cancelled() && (needs.changesets.result == 'success' || needs.changesets.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    
    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Validate pending changesets
      if: github.event_name == 'push'
      shell: pwsh
      run: |
        & ./scripts/Changesets.ps1 -Operation status

    - name: Restore
      run: dotnet restore Squad.SDK.NET.slnx

    - name: Build
      run: dotnet build Squad.SDK.NET.slnx --no-restore -c Release

    - name: Test
      run: dotnet test Squad.SDK.NET.slnx --no-build -c Release --verbosity normal --collect:"XPlat Code Coverage"

    - name: Guard stable SDK version
      if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
      shell: pwsh
      run: |
        $version = dotnet msbuild src/Squad.SDK.NET/Squad.SDK.NET.csproj -getProperty:Version --verbosity quiet

        if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'The SDK project does not evaluate a Version property.'
        }

        if ($version -match '-') {
            throw "The SDK version '$version' includes a prerelease suffix. Preview releases are created through promotion, so pull requests must keep the csproj on a stable SemVer value."
        }

    - name: Pack
      run: dotnet pack src/Squad.SDK.NET/Squad.SDK.NET.csproj --no-build -c Release -o ./artifacts
      if: matrix.os == 'ubuntu-latest'

    - name: Upload NuGet package
      uses: actions/upload-artifact@v7
      if: matrix.os == 'ubuntu-latest'
      with:
        name: nuget-package
        path: ./artifacts/*.nupkg

    - name: Upload coverage
      uses: actions/upload-artifact@v7
      if: matrix.os == 'ubuntu-latest'
      with:
        name: coverage-report
        path: '**/TestResults/**/coverage.cobertura.xml'

  publish-ci:
    name: Publish CI package to GitHub Packages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    permissions:
      packages: write
    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore Squad.SDK.NET.slnx

    - name: Set CI version
      id: ci-version
      shell: bash
      run: |
        BASE=$(dotnet msbuild src/Squad.SDK.NET/Squad.SDK.NET.csproj -getProperty:Version --verbosity quiet)
        echo "version=${BASE}-ci.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

    - name: Pack
      shell: bash
      run: |
        dotnet pack src/Squad.SDK.NET/Squad.SDK.NET.csproj \
          --no-restore \
          -c Release \
          -o ./artifacts \
          -p:Version=${{ steps.ci-version.outputs.version }}

    - name: Publish to GitHub Packages
      shell: bash
      run: |
        dotnet nuget push ./artifacts/*.nupkg \
          --api-key "${{ secrets.GITHUB_TOKEN }}" \
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          --skip-duplicate

  publish-dev:
    name: Publish dev package to GitHub Packages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      packages: write
    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore Squad.SDK.NET.slnx

    - name: Set dev version
      id: dev-version
      shell: bash
      run: |
        BASE=$(dotnet msbuild src/Squad.SDK.NET/Squad.SDK.NET.csproj -getProperty:Version --verbosity quiet)
        echo "version=${BASE}-dev" >> "$GITHUB_OUTPUT"

    - name: Pack
      shell: bash
      run: |
        dotnet pack src/Squad.SDK.NET/Squad.SDK.NET.csproj \
          --no-restore \
          -c Release \
          -o ./artifacts \
          -p:Version=${{ steps.dev-version.outputs.version }}

    - name: Publish to GitHub Packages
      shell: bash
      run: |
        dotnet nuget push ./artifacts/*.nupkg \
          --api-key "${{ secrets.GITHUB_TOKEN }}" \
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          --skip-duplicate
