name: Squad CI
# dotnet project — configure build/test commands below

on:
  pull_request:
    branches: [dev, preview, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build and test
        run: |
          dotnet build Squad.SDK.NET.slnx -c Release
          dotnet test Squad.SDK.NET.slnx -c Release --no-build
