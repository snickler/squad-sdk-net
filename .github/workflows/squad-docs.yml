name: Squad Docs — Build & Deploy
# dotnet project — configure documentation build commands below

on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths:
      - 'docs/**'
      - '.github/workflows/squad-docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build docs
        run: |
          echo "Docs are markdown-only; no build step required"
