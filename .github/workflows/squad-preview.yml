name: Squad Preview Validation
# dotnet project — configure build/test commands below

on:
  push:
    branches: [preview]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build and test
        run: |
          dotnet build Squad.SDK.NET.slnx -c Release
          dotnet test Squad.SDK.NET.slnx -c Release --no-build

      - name: Validate
        run: |
          dotnet test tests/Squad.SDK.NET.Tests/Squad.SDK.NET.Tests.csproj -c Release --no-build
