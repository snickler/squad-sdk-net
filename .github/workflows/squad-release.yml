name: Squad Release
# dotnet project — configure build, test, and release commands below

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build and test
        run: |
          dotnet build Squad.SDK.NET.slnx -c Release
          dotnet test Squad.SDK.NET.slnx -c Release --no-build

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet pack src/Squad.SDK.NET/Squad.SDK.NET.csproj -c Release
