name: Sync Check (Upstream)

on:
  workflow_call:
    inputs:
      upstream-repo:
        description: 'Upstream repo in owner/repo format'
        type: string
        default: 'bradygaster/squad'
      upstream-branch:
        description: 'Branch to monitor on the upstream repo'
        required: true
        type: string
      sync-label:
        description: 'Branch-specific sync label (e.g., sync:dev)'
        required: true
        type: string

permissions:
  issues: write
  contents: read

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream for new commits
        uses: actions/github-script@v9
        env:
          UPSTREAM_REPO: ${{ inputs.upstream-repo }}
          UPSTREAM_BRANCH: ${{ inputs.upstream-branch }}
          SYNC_LABEL: ${{ inputs.sync-label }}
        with:
          script: |
            const [upstreamOwner, upstreamRepo] = process.env.UPSTREAM_REPO.split('/');
            const upstreamBranch = process.env.UPSTREAM_BRANCH;
            const syncLabel = process.env.SYNC_LABEL;
            const baseLabels = ['sync', 'squad', syncLabel];

            // 1. Get the latest commit SHA on the upstream branch
            let latestSha;
            try {
              const { data: branch } = await github.rest.repos.getBranch({
                owner: upstreamOwner,
                repo: upstreamRepo,
                branch: upstreamBranch,
              });
              latestSha = branch.commit.sha;
            } catch (err) {
              core.setFailed(`Could not fetch upstream branch '${upstreamBranch}': ${err.message}`);
              return;
            }

            core.info(`Upstream ${upstreamBranch} HEAD: ${latestSha}`);

            // 2. Find any prior sync issue — avoid duplicates and determine last-synced SHA.
            //    Searching both open and closed in one call prevents re-emitting issues on
            //    every run when no closed issue yet exists (bootstrap case) or after a label
            //    rename migration (e.g. sync:insider → sync:preview).
            let lastSyncedSha = null;
            let openIssueFound = false;

            const { data: allIssueResults } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['sync', syncLabel].join(','),
              state: 'all',
              sort: 'created',
              direction: 'desc',
              per_page: 10,
            });

            const priorIssues = allIssueResults.filter(i => !i.pull_request);
            for (const issue of priorIssues) {
              const shaMatch = issue.body?.match(/<!-- upstream-sha: ([a-f0-9]+) -->/);
              if (shaMatch) {
                if (shaMatch[1] === latestSha) {
                  // Already tracking this exact upstream HEAD (open or closed) — nothing new
                  core.info(`Upstream ${upstreamBranch} HEAD already tracked in issue #${issue.number} (${issue.state}) — skipping`);
                  return;
                }
                if (!lastSyncedSha) {
                  lastSyncedSha = shaMatch[1];
                  core.info(`Last synced SHA: ${lastSyncedSha} (from issue #${issue.number}, ${issue.state})`);
                }
              }
              if (issue.state === 'open') {
                openIssueFound = true;
              }
            }

            // If an open issue already exists (with a different or no SHA marker), don't create another
            if (openIssueFound) {
              core.info(`Open sync issue already exists — skipping issue creation`);
              return;
            }

            // 3. Get the commit diff
            let commits = [];
            let filesChanged = [];
            let totalCommits = 0;

            if (lastSyncedSha) {
              try {
                const { data: comparison } = await github.rest.repos.compareCommits({
                  owner: upstreamOwner,
                  repo: upstreamRepo,
                  base: lastSyncedSha,
                  head: latestSha,
                });
                commits = comparison.commits;
                filesChanged = comparison.files || [];
                totalCommits = comparison.total_commits || commits.length;
              } catch (err) {
                // Only fall back for divergence errors (404/409); fail on transient errors
                if (err.status === 404 || err.status === 409) {
                  core.warning(`Comparison failed (diverged history?): ${err.message} — falling back to recent commits`);
                  const { data: recent } = await github.rest.repos.listCommits({
                    owner: upstreamOwner,
                    repo: upstreamRepo,
                    sha: upstreamBranch,
                    per_page: 20,
                  });
                  commits = recent;
                  totalCommits = commits.length;
                } else {
                  core.setFailed(`GitHub API error during comparison: ${err.message}`);
                  return;
                }
              }
            } else {
              // First sync — grab recent commits for context
              const { data: recent } = await github.rest.repos.listCommits({
                owner: upstreamOwner,
                repo: upstreamRepo,
                sha: upstreamBranch,
                per_page: 20,
              });
              commits = recent;
              totalCommits = commits.length;
            }

            if (commits.length === 0) {
              core.info('No new commits found');
              return;
            }

            // 4. Build the issue body (issue #29 style)
            const date = new Date().toISOString().split('T')[0];

            // Sanitize commit messages — escape @ mentions to avoid pinging
            const sanitize = (msg) => msg.replace(/@/g, '`@`');

            const toCommitList = (items, max = 30) => {
              const visible = items.slice(0, max).map(c => {
                const msg = sanitize(c.commit.message.split('\n')[0]);
                const sha = c.sha.substring(0, 7);
                return `- [\`${sha}\`](https://github.com/${upstreamOwner}/${upstreamRepo}/commit/${c.sha}) ${msg}`;
              });
              if (items.length > max) {
                visible.push(`- _... and ${items.length - max} more commits_`);
              }
              return visible.join('\n');
            };

            const toFileDiffBlock = (files, max = 50) => {
              if (files.length === 0) {
                return '_File-level diff unavailable for this sync window._';
              }
              const lines = files.slice(0, max).map(f =>
                `${f.filename} | +${f.additions}/-${f.deletions}`
              );
              if (files.length > max) {
                lines.push(`... and ${files.length - max} more files`);
              }
              return ['```', ...lines, '```'].join('\n');
            };

            const commitList = toCommitList(commits);
            const fileDiffBlock = toFileDiffBlock(filesChanged);
            const branchHeader = `## 📦 \`${upstreamBranch}\` Branch: Changes to Port`;
            const baselineNote = lastSyncedSha
              ? `> Changes since previously tracked SHA \`${lastSyncedSha.substring(0, 7)}\`.`
              : '> **Initial sync** — No previous baseline recorded. Showing recent commits for context.';
            const stateTrackedSha = lastSyncedSha ? lastSyncedSha.substring(0, 7) : 'none';

            const title = `Sync: upstream ${upstreamBranch} changes — ${date}`;
            const body = [
              `<!-- upstream-sha: ${latestSha} -->`,
              '',
              `📦 **Phase 1: Port upstream \`${upstreamBranch}\` changes**`,
              '',
              `New changes detected in [${upstreamOwner}/${upstreamRepo}](https://github.com/${upstreamOwner}/${upstreamRepo}) \`${upstreamBranch}\` branch that need to be ported to our .NET implementation.`,
              '',
              '> **Instructions:**',
              `> 1. Port the \`${upstreamBranch}\` branch commits listed below to our \`${upstreamBranch}\` branch`,
              '> 2. Reference upstream commit SHAs in your commit messages when practical (e.g., "Port feature X (upstream/dev@a1b2c3d)")',
              `> 3. Update \`${upstreamBranch}.lastPortedSha\` in \`.sync/upstream-state.json\` to the target SHA below`,
              `> 4. Verify builds pass on \`${upstreamBranch}\``,
              '> 5. Close this issue after porting is complete',
              '',
              branchHeader,
              '',
              baselineNote,
              `> After porting, set \`lastPortedSha\` in \`.sync/upstream-state.json\` to \`${latestSha}\`.`,
              '',
              `Upstream \`${upstreamBranch}\` HEAD: \`${latestSha.substring(0, 7)}\` — **${totalCommits}** new commits.`,
              '',
              '### Commits',
              '',
              commitList,
              '',
              '### File Diff',
              '',
              fileDiffBlock,
              '',
              '## 📊 Sync State',
              '',
              '| Branch | Our Tracked SHA | Upstream HEAD | Status |',
              '|--------|----------------|---------------|--------|',
              `| ${upstreamBranch} | \`${stateTrackedSha}\` | \`${latestSha.substring(0, 7)}\` | 🔴 Changes pending |`,
              '',
              '## ✅ Completion Checklist',
              '',
              `- [ ] Port upstream \`${upstreamBranch}\` commits`,
              `- [ ] Update \`.sync/upstream-state.json\`: set \`${upstreamBranch}.lastPortedSha\` → \`${latestSha}\``,
              `- [ ] Verify build passes on \`${upstreamBranch}\` branch`,
              '- [ ] Close this issue',
            ].filter(Boolean).join('\n');

            // 5. Ensure required labels exist (race-safe: ignore 422 on create)
            const labelDefs = {
              'sync':          { color: 'F9D0C4', description: 'Upstream sync tracking' },
              'sync:dev':      { color: 'FEF2C0', description: 'Changes on upstream dev branch' },
              'sync:preview': { color: 'C2E0C6', description: 'Changes on upstream preview branch' },
              'squad':         { color: '9B8FCC', description: 'Squad triage inbox' },
            };

            for (const label of baseLabels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                });
              } catch (err) {
                if (err.status === 404) {
                  try {
                    const def = labelDefs[label] || { color: 'EDEDED', description: '' };
                    await github.rest.issues.createLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      name: label,
                      color: def.color,
                      description: def.description,
                    });
                    core.info(`Created label: ${label}`);
                  } catch (createErr) {
                    // 422 means another run already created it — safe to ignore
                    if (createErr.status !== 422) {
                      core.warning(`Could not create label '${label}': ${createErr.message}`);
                    }
                  }
                } else {
                  core.warning(`Could not verify label '${label}': ${err.message}`);
                }
              }
            }

            // 6. Create the sync issue
            const { data: newIssue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: baseLabels,
            });

            core.info(`Created sync issue #${newIssue.number}: ${title}`);
